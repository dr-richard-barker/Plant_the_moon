[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ptm-meta"
version = "0.1.0"
description = "FAIR scraping, hybrid AI/ML structured extraction, and meta-analysis of Plant the Moon Challenge regolith plant-growth reports."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Richard J. Barker", email = "dr.richard.barker@gmail.com" },
]
keywords = [
  "astrobotany",
  "lunar regolith",
  "martian regolith",
  "plant the moon challenge",
  "meta-analysis",
  "FAIR data",
  "CoSE",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "google-genai>=1.0",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "jupyter-book>=1.0,<2.0",
  "lxml>=5.2",
  "matplotlib>=3.8",
  "nbconvert>=7.16",
  "nbformat>=5.10",
  "numpy>=1.26",
  "pandas>=2.2",
  "pdfplumber>=0.11",
  "plotly>=5.22",
  "pyarrow>=16.0",
  "pydantic>=2.7",
  "pymupdf>=1.24",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "seaborn>=0.13",
  "shap>=0.45",
  "statsmodels>=0.14",
  "tenacity>=8.2",
  "umap-learn>=0.5",
]

[project.optional-dependencies]
embeddings = [
  "sentence-transformers>=3.0",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
ptm-meta = "ptm_meta.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ptm_meta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

name: CI and CoSE GitHub Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --frozen --extra dev
      - name: Lint and run test suite
        run: |
          uv run ruff check src tests
          uv run pytest -v
      - name: Validate FAIR schemas and RO-Crate
        run: uv run ptm-meta validate-fair

  build-pages:
    needs: test-and-validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: uv sync --frozen
      - name: Build Jupyter Book
        run: uv run jupyter-book build book/
      - name: Verify manuscript PDF exists
        run: test -s book/_static/manuscript/Plant_the_Moon_Meta_Analysis.pdf
      - name: Add .nojekyll for GitHub Pages
        run: touch book/_build/html/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: book/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build-pages
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
